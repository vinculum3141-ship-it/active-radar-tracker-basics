[project]
name = "radar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml>=6.0.3",
]

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

# Notebooks are trainer-only exploration artifacts (04-python-discipline.md §5):
# their cells share state and run out of order, so per-cell linting is
# misleading. Excluded from both ruff lint and format; verified by execution.
[tool.ruff]
extend-exclude = ["*.ipynb"]
