site_name: Beginner Helper Reference
site_description: Documentation for the beginner notebook helper scripts.
docs_dir: docs
site_url: ""
repo_url: https://github.com/your-org/active-radar-tracker-basics
repo_name: active-radar-tracker-basics

nav:
  - Home: index.md
  - Helper scripts: helper-api.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

plugins:
  - search
